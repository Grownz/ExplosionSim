name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Vulkan, SDL and X11 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev \
            python3-pil vulkan-validationlayers

      - name: Install DXC
        run: |
          curl -sSL -o /tmp/dxc.tar.gz \
            https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/linux_dxc_2026_09_28.x86_x64.tar.gz
          echo "96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1  /tmp/dxc.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/dxc"
          tar xzf /tmp/dxc.tar.gz -C "$HOME/dxc"
          echo "LD_LIBRARY_PATH=$HOME/dxc/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDXC_EXECUTABLE="$HOME/dxc/bin/dxc"

      - name: Build
        run: |
          cmake --build build --parallel
          cmake --build build --target vulkan_shaders

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Vulkan smoke (lavapipe)
        run: |
          ls -l /usr/share/vulkan/icd.d || true
          ./build/vulkan_smoke --headless --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_smoke.ppm
          ./build/vulkan_smoke --headless --triangle --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_triangle.ppm
          ./build/vulkan_smoke --headless --quad --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_quad.ppm
          ./build/vulkan_smoke --headless --sky --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_sky.ppm
          ./build/vulkan_smoke --headless --composite --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_composite.ppm
          ./build/vulkan_smoke --headless --ground --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_ground.ppm
          ./build/vulkan_smoke --headless --target --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_target.ppm
          ./build/vulkan_smoke --headless --bloom --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_bloom.ppm
          ./build/vulkan_smoke --headless --scene --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_scene.ppm
          ./build/vulkan_smoke --headless --shock --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_shock.ppm
          ./build/vulkan_smoke --headless --volume --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_volume.ppm
          ./build/vulkan_smoke --headless --particles --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_particles.ppm
          ./build/vulkan_smoke --headless --frame --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_frame.ppm
          ./build/vulkan_smoke --headless --scene-frame --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_scene_frame.ppm
          ./build/vulkan_smoke --headless --city --width 320 --height 180 \
            --frames 2 --output /tmp/vulkan_city.ppm

      - name: Linux application screenshot (lavapipe)
        run: |
          ./build/explosion_linux --settings tools/capture_settings.ini \
            --headless --width 320 --height 180 --frames 2 --time 0.1 \
            --charge 0.2 --distance-scale 0.55 \
            --screenshot /tmp/explosion_linux.png
          test -s /tmp/explosion_linux.png
          cp /tmp/explosion_linux.png linux_capture.png

      - name: Upload Linux screenshot
        uses: actions/upload-artifact@v6
        with:
          name: ExplosionSim-linux-screenshot
          path: linux_capture.png

      - name: Linux high-fidelity solver screenshot (lavapipe)
        run: |
          ./build/explosion_linux --settings tools/capture_settings.ini \
            --high-fidelity --solver-resolution 32 --no-solver-auto-scale \
            --headless --width 320 --height 180 --frames 1 --time 0.01 \
            --charge 0.2 --distance-scale 0.55 \
            --screenshot /tmp/explosion_linux_hf.png
          test -s /tmp/explosion_linux_hf.png
          cp /tmp/explosion_linux_hf.png linux_hf_capture.png

      - name: Upload Linux high-fidelity screenshot
        uses: actions/upload-artifact@v6
        with:
          name: ExplosionSim-linux-hf-screenshot
          path: linux_hf_capture.png

      - name: Solver benchmark (lavapipe, GPU timestamps)
        run: |
          ./build/explosion_linux --settings tools/capture_settings.ini \
            --solver-benchmark --solver-resolution 32 \
            --no-solver-auto-scale --solver-step-count 32 --solver-steps 16 \
            2>&1 | tee /tmp/solver_benchmark.log
          grep -q "GPU total" /tmp/solver_benchmark.log
          grep -q "sweeps" /tmp/solver_benchmark.log

      - name: Frame benchmark (lavapipe)
        run: |
          ./build/explosion_linux --settings tools/capture_settings.ini \
            --benchmark --frames 30 --width 320 --height 180 \
            2>&1 | tee /tmp/frame_benchmark.log
          grep -q "Average:" /tmp/frame_benchmark.log

      - name: Settings round-trip (lavapipe)
        run: |
          ./build/explosion_linux --settings tools/capture_settings.ini \
            --write-settings /tmp/roundtrip.ini
          ./build/explosion_linux --settings /tmp/roundtrip.ini \
            --headless --width 320 --height 180 --frames 1 --time 0.1 \
            --charge 0.2 --distance-scale 0.55 \
            --screenshot /tmp/roundtrip.png
          python3 tools/compare_png.py tools/reference/win_capture.png \
            /tmp/roundtrip.png --tolerance 20 --max-fraction 0.20

      - name: Non-ASCII settings path (lavapipe)
        run: |
          mkdir -p "/tmp/äöü"
          cp tools/capture_settings.ini "/tmp/äöü/settings.ini"
          ./build/explosion_linux --settings "/tmp/äöü/settings.ini" \
            --headless --width 320 --height 180 --frames 1 --time 0.1 \
            --charge 0.2 --distance-scale 0.55 \
            --screenshot /tmp/unicode_settings.png
          python3 tools/compare_png.py tools/reference/win_capture.png \
            /tmp/unicode_settings.png --tolerance 20 --max-fraction 0.20

      - name: Splash render (dummy video, software renderer)
        run: |
          SDL_VIDEODRIVER=dummy ./build/explosion_linux --splash-test \
            --splash-screenshot /tmp/splash.png
          test -s /tmp/splash.png
          python3 - <<'PY'
          from PIL import Image
          image = Image.open('/tmp/splash.png')
          assert image.size[0] >= 320 and image.size[1] >= 240, image.size
          print('splash screenshot', image.size)
          PY

      - name: Package and run from a clean directory
        run: |
          cmake --build build --target package_linux
          rm -rf /tmp/explosion-package
          mkdir -p /tmp/explosion-package
          tar xzf build/ExplosionSim-linux-x86_64.tar.gz -C /tmp/explosion-package
          cd /tmp/explosion-package/ExplosionSim-linux-x86_64
          ./ExplosionSim --settings "$GITHUB_WORKSPACE/tools/capture_settings.ini" \
            --headless --width 320 --height 180 --frames 1 --time 0.1 \
            --charge 0.2 --distance-scale 0.55 \
            --screenshot /tmp/package_capture.png
          test -s /tmp/package_capture.png
          python3 "$GITHUB_WORKSPACE/tools/compare_png.py" \
            "$GITHUB_WORKSPACE/tools/reference/win_capture.png" \
            /tmp/package_capture.png --tolerance 20 --max-fraction 0.20

      - name: Vulkan validation layers (lavapipe)
        run: |
          ./build/explosion_linux --settings tools/capture_settings.ini --debug \
            --headless --width 320 --height 180 --frames 1 --time 0.1 \
            --charge 0.2 --distance-scale 0.55 \
            --screenshot /tmp/validation.png 2>&1 | tee /tmp/validation.log
          ./build/explosion_linux --settings tools/capture_settings.ini --debug \
            --high-fidelity --solver-resolution 32 --no-solver-auto-scale \
            --headless --width 320 --height 180 --frames 1 --time 0.01 \
            --charge 0.2 --distance-scale 0.55 \
            --screenshot /tmp/validation_hf.png 2>&1 | tee -a /tmp/validation.log
          ! grep -q "validation layer is not available" /tmp/validation.log
          ! grep -q "\[error\] Vulkan:" /tmp/validation.log

      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: ExplosionSim-linux-x86_64
          path: build/ExplosionSim-linux-x86_64.tar.gz

  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ cmake

      - name: Configure with ASan/UBSan
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DEXPLOSION_SANITIZE=ON -DEXPLOSION_BUILD_VULKAN_SMOKE=OFF

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/Release/ExplosionSim.exe artifact/
          Copy-Item build/Release/ExplosionSimUpdater.exe artifact/
          Copy-Item -Recurse build/Release/assets artifact/
          Copy-Item README.md, LICENSE artifact/
          Copy-Item third_party/miniz/LICENSE artifact/LICENSE-miniz.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ExplosionSim-win64
          path: artifact/

  capture-parity:
    runs-on: ubuntu-24.04
    needs: [linux-core]
    steps:
      - uses: actions/checkout@v5

      - name: Download Linux screenshot
        uses: actions/download-artifact@v6
        with:
          name: ExplosionSim-linux-screenshot
          path: artifacts/linux

      - name: Compare screenshots
        run: |
          python3 tools/compare_png.py \
            tools/reference/win_capture.png \
            artifacts/linux/linux_capture.png \
            --tolerance 20 --max-fraction 0.20

      - name: Download Linux high-fidelity screenshot
        uses: actions/download-artifact@v6
        with:
          name: ExplosionSim-linux-hf-screenshot
          path: artifacts/linux-hf

      - name: Compare high-fidelity screenshots
        run: |
          # The Euler solver itself is deterministic (same step count, dt and
          # maximum speed); the wider tolerance covers the remaining preview
          # renderer gap, which the reduced-order capture already exposes.
          python3 tools/compare_png.py \
            tools/reference/win_hf_capture.png \
            artifacts/linux-hf/linux_hf_capture.png \
            --tolerance 22 --max-fraction 0.30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [windows, linux-core]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download Windows artifact
        uses: actions/download-artifact@v6
        with:
          name: ExplosionSim-win64
          path: artifacts/windows

      - name: Download Linux package
        uses: actions/download-artifact@v6
        with:
          name: ExplosionSim-linux-x86_64
          path: artifacts/linux

      - name: Package the Windows artifact
        run: |
          cd artifacts/windows
          zip -r ../../ExplosionSim-win64.zip .

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v header="## [$VERSION]" \
            'index($0, header) == 1 {flag=1; next} /^## \[/ {flag=0} flag' \
            CHANGELOG.md > release_notes.md
          test -s release_notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ExplosionSim-win64.zip \
            artifacts/linux/ExplosionSim-linux-x86_64.tar.gz \
            --title "Explosion Simulator ${GITHUB_REF_NAME#v}" \
            --notes-file release_notes.md
