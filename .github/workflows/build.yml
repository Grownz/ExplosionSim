name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/Release/ExplosionSim.exe artifact/
          Copy-Item build/Release/ExplosionSimUpdater.exe artifact/
          Copy-Item -Recurse build/Release/assets artifact/
          Copy-Item README.md, LICENSE artifact/
          Copy-Item third_party/miniz/LICENSE artifact/LICENSE-miniz.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ExplosionSim-win64
          path: artifact/
